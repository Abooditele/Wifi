name: Build ARM64 APK & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required permission for creating GitHub Releases and uploading assets.
permissions:
  contents: write

concurrency:
  group: build-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build arm64-v8a Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # Permanent keystore committed to repo (my-upload-key.jks at repo root)
      KEYSTORE_PASSWORD: lanmessenger123
      KEY_PASSWORD: lanmessenger123

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 'current'
          cache-disabled: false

      - name: Verify permanent keystore exists in repo
        run: |
          set -euo pipefail
          KEYSTORE="${{ github.workspace }}/my-upload-key.jks"
          if [ ! -f "$KEYSTORE" ]; then
            echo "::error::Permanent keystore (my-upload-key.jks) is missing from the repository."
            exit 1
          fi
          ls -la "$KEYSTORE"
          keytool -list -v -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" -alias upload | head -20

      - name: Build arm64-v8a release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Locate built APK
        id: locate
        if: success()
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK file found in app/build/outputs/apk"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          ls -la "$APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Stage APK with descriptive name
        if: success()
        run: |
          set -euo pipefail
          STAGED="${{ github.workspace }}/Wifi-arm64-v8a-release.apk"
          cp "${{ steps.locate.outputs.apk_path }}" "$STAGED"
          ls -la "$STAGED"

      - name: Compute checksum
        id: checksum
        if: success()
        run: |
          set -euo pipefail
          APK="${{ github.workspace }}/Wifi-arm64-v8a-release.apk"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "$SHA  Wifi-arm64-v8a-release.apk" > Wifi-arm64-v8a-release.apk.sha256
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA"

      - name: Prepare release tag
        id: tag
        if: success()
        run: |
          TAG="v2.0-arm64-${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create GitHub Release and upload APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "WiFi Messenger ${{ steps.tag.outputs.tag }}"
          body: |
            # WiFi Messenger — ARM64 Release

            **Architecture:** `arm64-v8a` (ARM 64-bit only)
            **Build number:** ${{ github.run_number }}
            **Commit:** ${{ github.sha }}

            ## What's New in v2.0
            - Permanent release signing key (committed to repo)
            - 25+ new features including: voice/video calls, file sharing, voice messages UI, video sharing, location, group chats, reply/edit/delete/forward, reactions, pin/star, delivery/read receipts, typing indicator, online/last-seen, unread badges, manual IP, auto-reconnect, network quality indicator, WiFi Direct scaffolding, app lock, block users, backup/restore, export chat, full visual customization pack
            - Background notifications with deep-link navigation to source conversation
            - Fixed keyboard overlapping the chat input field

            ## Installation
            1. Download `Wifi-arm64-v8a-release.apk` below.
            2. Verify integrity with the `.sha256` file:
               ```
               sha256sum -c Wifi-arm64-v8a-release.apk.sha256
               ```
            3. Enable "Install from unknown sources" on your ARM64 Android device.
            4. Install the APK (you may need to uninstall older versions signed with the CI-generated ephemeral key).

            SHA-256: `${{ steps.checksum.outputs.sha256 }}`
          files: |
            Wifi-arm64-v8a-release.apk
            Wifi-arm64-v8a-release.apk.sha256
          fail_on_unmatched_files: true
          prerelease: false
          generate_release_notes: false
