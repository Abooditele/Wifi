name: Build ARM64 APK & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required permission for creating GitHub Releases and uploading assets.
permissions:
  contents: write

concurrency:
  group: build-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build arm64-v8a Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Hardcoded password for the ephemeral release keystore generated on each run.
      # The keystore itself is never persisted (not committed, not uploaded),
      # so the password value is not security-sensitive.
      KEYSTORE_PASSWORD: changeit
      KEY_PASSWORD: changeit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            tools
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 'current'
          cache-disabled: false

      - name: Generate ephemeral release keystore
        run: |
          set -euo pipefail
          KEYSTORE="${{ github.workspace }}/my-upload-key.jks"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Abooditele, OU=Mobile, O=Wifi, L=Baghdad, ST=Baghdad, C=IQ"
          echo "Keystore generated at: $KEYSTORE"
          ls -la "$KEYSTORE"

      - name: Build arm64-v8a release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle assembleArm64-v8aRelease \
            --no-daemon \
            --stacktrace

      - name: Locate built APK
        id: locate
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK file found in app/build/outputs/apk"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          ls -la "$APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Stage APK with descriptive name
        run: |
          set -euo pipefail
          STAGED="${{ github.workspace }}/Wifi-arm64-v8a-release.apk"
          cp "${{ steps.locate.outputs.apk_path }}" "$STAGED"
          ls -la "$STAGED"

      - name: Compute checksum
        id: checksum
        run: |
          set -euo pipefail
          APK="${{ github.workspace }}/Wifi-arm64-v8a-release.apk"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "$SHA  Wifi-arm64-v8a-release.apk" > Wifi-arm64-v8a-release.apk.sha256
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA"

      - name: Prepare release tag
        id: tag
        run: |
          TAG="v1.0-arm64-${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "WiFi Messenger ${{ steps.tag.outputs.tag }}"
          body: |
            # WiFi Messenger — ARM64 Release

            **Architecture:** `arm64-v8a` (ARM 64-bit only)
            **Build number:** ${{ github.run_number }}
            **Commit:** ${{ github.sha }}

            ## Installation
            1. Download `Wifi-arm64-v8a-release.apk` below.
            2. Verify integrity with the `.sha256` file:
               ```
               sha256sum -c Wifi-arm64-v8a-release.apk.sha256
               ```
            3. Enable "Install from unknown sources" on your ARM64 Android device.
            4. Install the APK.

            SHA-256: `${{ steps.checksum.outputs.sha256 }}`
          files: |
            Wifi-arm64-v8a-release.apk
            Wifi-arm64-v8a-release.apk.sha256
          fail_on_unmatched_files: true
          prerelease: false
          generate_release_notes: false
